{% extends "base.html" %}

{% block title %}Server Error (500) - HairSync{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="p-5 bg-white rounded-4 shadow-sm border">
                <div class="display-1 fw-bold text-danger mb-2">500</div>
                <h3 class="fw-bold mb-3">Internal Server Error</h3>
                <p class="text-muted mb-4">
                    An unexpected error occurred while processing your request.
                </p>
                {% if error %}
                    <div class="p-3 bg-light rounded-3 text-start small font-monospace text-danger mb-4 border">
                        {{ error }}
                    </div>
                {% endif %}
                <a href="{{ url_for('index') }}" class="btn btn-hs-primary rounded-pill px-4">
                    <i class="bi bi-house me-1"></i> Return to Homepage
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
