{% extends "base.html" %}

{% block title %}Page Not Found (404) - HairSync{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="p-5 bg-white rounded-4 shadow-sm border">
                <div class="display-1 fw-bold text-teal mb-2" style="color: #0d6e6e;">404</div>
                <h3 class="fw-bold mb-3">Page Not Found</h3>
                <p class="text-muted mb-4">
                    The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
                </p>
                <a href="{{ url_for('index') }}" class="btn btn-hs-primary rounded-pill px-4">
                    <i class="bi bi-house me-1"></i> Return to Homepage
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
